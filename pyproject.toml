[project]
name = "change-guardian"
version = "0.2.0"
description = "Human-in-the-loop AI incident triage agent for payment-network operations (UGA FinTech Capstone x Mastercard)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "openpyxl>=3.1",
    "pydantic>=2.8",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "streamlit>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
# Local model inference + LoRA fine-tuning (Hugging Face stack).
ml = [
    "torch>=2.4",
    "transformers>=4.46",
    "peft>=0.13",
    "accelerate>=1.0",
    "datasets>=3.0",
    "mlflow>=2.17",
]
# Optional hosted backend for comparison runs and teacher distillation.
anthropic = ["anthropic>=0.40"]

[dependency-groups]
dev = ["pytest>=8.3", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["slow: downloads a model or trains; run with -m slow"]
addopts = "-m 'not slow'"
